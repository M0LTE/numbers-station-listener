name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Format
        run: test -z "$(gofmt -l . | grep -v node_modules)"
      - name: Vet
        run: go vet ./...
      - name: Test
        # Hermetic: never touches Priyom or any UberSDR (NSL_INTEGRATION unset).
        run: go test -race ./...
      - name: No em or en dashes
        run: |
          if grep -rnP '[\x{2013}\x{2014}]' --include='*.go' --include='*.ts' --include='*.css' --include='*.html' --include='*.md' --include='*.json' --exclude-dir=node_modules --exclude=brief.md . ; then
            echo "Found an em or en dash; use a hyphen, comma or new sentence." >&2
            exit 1
          fi
      - name: Docker image builds
        run: docker build -t nsl:ci .
